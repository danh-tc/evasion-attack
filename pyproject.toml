[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evasion-attack"
version = "0.1.0"
description = "OA-TRaPA: Object-Aware Temporal Random Parameter Pruning attack on object detectors"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["evasion_attack*"]
